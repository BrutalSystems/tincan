name: Publish

# Tag-driven, matching RELEASING.md. Pushing v0.5.0 publishes 0.5.0, and
# nothing publishes from a branch push — a release should be a deliberate act.
#
# Authentication is npm trusted publishing over OIDC: there is no npm token,
# here or in the repository secrets. The registry trusts this exact repo, this
# exact workflow FILENAME, and the `npm` environment below. Renaming this file
# or that environment breaks publishing until the trusted publisher is
# reconfigured. See docs/ci-cd-standard.md.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    # A fork that pushes a tag gets no run at all. OIDC would refuse it anyway,
    # but an explicit gate beats a confusing red run in someone else's fork.
    if: github.repository == 'BrutalSystems/tincan'

    # Part of the trusted-publisher identity, not decoration. Also where a
    # required reviewer goes, since OIDC widens publish rights from "whoever
    # holds the token" to "whoever can push a tag".
    environment: npm

    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC: the npm credential itself, and provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The engines floor. The runner stays on it; npm is upgraded below
          # rather than moving the whole runtime.
          node-version: '22'
          registry-url: https://registry.npmjs.org
          # No dependency cache in a release build.
          package-manager-cache: false

      # Node 22 ships npm 10.x; trusted publishing needs >= 11.5.1.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm -v

      # Cheapest checks first — fail before installing anything.
      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $pkg"
            exit 1
          fi
          echo "releasing $pkg"

      # A version already on the registry is not an error — a re-pushed tag, or
      # a release published by hand, should leave this run green with nothing
      # to do. Shipping the WRONG version is what the check above catches, and
      # that one does fail.
      - name: Already published?
        id: published
        run: |
          pkg=$(node -p "require('./package.json').version")
          if npm view "@brutalsystems/tincan@$pkg" version >/dev/null 2>&1; then
            echo "::notice::@brutalsystems/tincan@$pkg is already on the registry — nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: steps.published.outputs.skip == 'false'

      - run: npm run build
        if: steps.published.outputs.skip == 'false'

      - run: npm run typecheck:plugin
        if: steps.published.outputs.skip == 'false'

      - run: npm test
        if: steps.published.outputs.skip == 'false'

      - name: Pack
        id: pack
        if: steps.published.outputs.skip == 'false'
        run: |
          pkg=$(node -p "require('./package.json').version")
          echo "tarball=brutalsystems-tincan-$pkg.tgz" >> "$GITHUB_OUTPUT"
          npm pack

      - name: Verify the tarball
        if: steps.published.outputs.skip == 'false'
        run: node scripts/verify-tarball.mjs

      # Install the packed artifact and run the binary. Nothing else in this
      # pipeline would notice a broken `bin`, a missing dist file, or a bad
      # shebang — the unit tests import source, not the package.
      - name: Smoke-test the packed artifact
        if: steps.published.outputs.skip == 'false'
        run: |
          prefix=$(mktemp -d)
          npm install -g --prefix "$prefix" "./${{ steps.pack.outputs.tarball }}"
          out=$("$prefix/bin/tincan" --help 2>&1 | head -3 || true)
          echo "$out"
          if [ -z "$out" ]; then
            echo "::error::the installed binary produced no output"
            exit 1
          fi

      # Publish the artifact that was just smoke-tested, not the directory, so
      # what shipped is exactly what was checked. No NODE_AUTH_TOKEN: OIDC
      # supplies the credential, and provenance follows from it.
      - name: Publish
        if: steps.published.outputs.skip == 'false'
        run: npm publish "./${{ steps.pack.outputs.tarball }}" --provenance

      - name: Confirm the registry is serving it
        id: served
        if: steps.published.outputs.skip == 'false'
        run: |
          pkg=$(node -p "require('./package.json').version")
          for i in $(seq 1 10); do
            if npm view "@brutalsystems/tincan@$pkg" version >/dev/null 2>&1; then
              echo "registry serving $pkg"
              npm view "@brutalsystems/tincan@$pkg" dist.integrity
              echo "served=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "not yet (attempt $i), waiting 20s"; sleep 20
          done
          echo "served=false" >> "$GITHUB_OUTPUT"
          echo "::warning::registry still not serving $pkg — publishes lag by 1-2 minutes"

      # Everything above inspects a local build. This is the only check that
      # sees what a consumer actually downloads. Skipped, not failed, when the
      # registry has not caught up — the publish itself already succeeded.
      - name: Verify the PUBLISHED artifact
        if: steps.published.outputs.skip == 'false' && steps.served.outputs.served == 'true'
        run: |
          pkg=$(node -p "require('./package.json').version")
          mkdir -p /tmp/published
          npm pack "@brutalsystems/tincan@$pkg" --pack-destination /tmp/published >/dev/null
          tar tzf "/tmp/published/brutalsystems-tincan-$pkg.tgz" | sed 's|^package/||' | grep -v '/$' | sort > /tmp/remote.txt
          tar tzf "./${{ steps.pack.outputs.tarball }}"          | sed 's|^package/||' | grep -v '/$' | sort > /tmp/local.txt
          if ! diff -u /tmp/local.txt /tmp/remote.txt; then
            echo "::error::the published tarball does not match what this run packed"
            exit 1
          fi
          echo "published artifact matches — $(wc -l < /tmp/remote.txt) files"

      # Tincan has no RELEASE_NOTES.md; the tag annotation is its release
      # record. A repo that keeps release notes extracts that version's
      # section here instead. See docs/ci-cd-standard.md.
      - name: GitHub Release
        if: steps.published.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-from-tag --verify-tag
