name: Publish

# Tag-driven, matching RELEASING.md step 4. Pushing v0.5.0 publishes 0.5.0.
# Nothing publishes from a branch push — a release should be a deliberate act.
#
# Authentication is npm trusted publishing over OIDC: there is no npm token,
# here or in the repository secrets. The registry trusts this exact repo, this
# exact workflow FILENAME, and the `npm` environment below. Renaming this file
# or changing that environment breaks publishing until the trusted publisher is
# reconfigured on npmjs.com. See RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    # Gives you somewhere to hang a required reviewer in repo settings if you
    # ever want a human gate. With no protection rules configured it is a no-op.
    environment: npm

    permissions:
      contents: read
      id-token: write # OIDC: the npm credential itself, and provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1, and Node 22 ships npm 10.x.
          # The engines floor stays >=22 and CI still tests on 22; only the
          # publishing runner has to be newer.
          node-version: '24'
          registry-url: https://registry.npmjs.org
          # No dependency cache in a release build.
          package-manager-cache: false

      - run: npm ci

      # A published version is immutable and cannot be unpublished after 72
      # hours. Refuse to ship a tag that disagrees with the manifest rather
      # than discovering the mismatch in the registry.
      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $pkg"
            exit 1
          fi
          echo "publishing $pkg"

      - name: Refuse to republish an existing version
        run: |
          pkg=$(node -p "require('./package.json').version")
          if npm view "@brutalsystems/tincan@$pkg" version >/dev/null 2>&1; then
            echo "::error::@brutalsystems/tincan@$pkg is already on the registry"
            exit 1
          fi

      # prepublishOnly runs build + typecheck:plugin + test, so a broken
      # build cannot ship. Running them here too makes the failure legible
      # in its own step rather than buried in npm's output.
      - run: npm run build
      - run: npm run typecheck:plugin
      - run: npm test

      # No NODE_AUTH_TOKEN. OIDC supplies the credential, and provenance is
      # generated automatically because the credential is a trusted publisher.
      - name: Publish
        run: npm publish

      - name: Verify against the registry
        run: |
          pkg=$(node -p "require('./package.json').version")
          for i in 1 2 3 4 5 6; do
            if [ "$(npm view @brutalsystems/tincan version 2>/dev/null)" = "$pkg" ]; then
              echo "registry reports $pkg"; exit 0
            fi
            echo "registry not caught up yet (attempt $i), waiting 20s"; sleep 20
          done
          echo "::warning::registry still not reporting $pkg — it lags publishes by 1-2 minutes"
