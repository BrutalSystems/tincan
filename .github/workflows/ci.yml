name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the engines floor; 24 is what development happens on.
        # Both must stay green or the floor is a fiction.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck the opencode plugin
        run: npm run typecheck:plugin

      - name: Test
        run: npm test

      # All four version locations in one check, against package.json as the
      # source. The suite covers three of them from the other direction; this
      # also catches the fourth, which is prose, and names every drifted file
      # at once instead of the first. See RELEASING.md.
      - name: Every version site agrees with package.json
        run: npm run check-version

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      # Same check the publish job runs, on every push — so tarball drift
      # surfaces when it is introduced, not at release time.
      - name: Verify the tarball
        run: node scripts/verify-tarball.mjs
